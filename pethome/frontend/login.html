<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetHome - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .password-wrapper { position: relative; width: 100%; }
    .password-wrapper input { width: 100%; box-sizing: border-box; padding-right: 45px !important; }
    .toggle-eye {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      cursor: pointer; font-size: 1.1rem; background: none; border: none;
      width: auto; padding: 0; color: #999;
    }
    .toggle-eye:hover { background: none; transform: translateY(-50%); box-shadow: none; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><img src="logo.png" alt="logo"> PetHome</div>
    <nav id="main-nav"></nav>
  </header>

  <main class="login-container">
    <div class="login-card">
      <div class="login-icon"><img src="logo.png" alt="logo"></div>
      <h2>Welcome Back!</h2>
      <p>Log in to your PetHome account to find your furry companion</p>

      <div id="error-msg" style="display:none; background:#ffeaea; color:#e74c3c; padding:12px; border-radius:8px; margin-bottom:16px; font-weight:bold; text-align:center;"></div>

      <form id="login-form" class="login-form" autocomplete="off">
        <div class="form-group">
          <label>Email Address</label>
          <input type="text" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <i class="fa-regular fa-eye-slash" 
            onclick="togglePassword('password', this)"
            style="position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1.2rem; user-select:none; color: #666;">
            </i>
          </div>
        </div>
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember"><span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="login-btn" id="submitBtn">Log In</button>
      </form>

      <div class="signup-link">
        Don't have an account? <a href="register.html">Sign up free</a>
      </div>
    </div>
  </main>

  <footer>
    <p>🐾 &copy; 2025 PetHome. All rights reserved.</p>
  </footer>

  <script src="navbar.js"></script>
  <script>
    renderNav('main-nav');

    function togglePassword(id, icon) {
      const input = document.getElementById(id);
    
       if (input.type === 'password') {
         input.type = 'text';
         // تغيير شكل الأيقونة للعين المفتوحة
         icon.className = 'fa-regular fa-eye'; 
        } else {
         input.type = 'password';
        // تغيير شكل الأيقونة للعين المقفولة (عليها خط)
         icon.className = 'fa-regular fa-eye-slash'; 
    }
}

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errorMsg = document.getElementById('error-msg');
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.textContent = 'Logging in...';
      submitBtn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Redirect based on role
        if (data.user.role === 'shelter' || data.user.role === 'rescuer') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'index.html';
        }

      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        submitBtn.textContent = 'Log In';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
