<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PetHome</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
      .password-wrapper { position: relative; width: 100%; }
      .password-wrapper input { width: 100%; box-sizing: border-box; padding-right: 45px !important; }
      .toggle-eye {
        position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        cursor: pointer; font-size: 1.1rem; background: none; border: none;
        width: auto; padding: 0; color: #999; line-height: 1;
      }
      /* .toggle-eye:hover { background: none; transform: translateY(-50%); box-shadow: none; } */
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="logo.png" alt="logo"> PetHome</div>
        <nav id="main-nav">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <a href="index.html" class="back-link">← Back to Home</a>
        <div class="job-details-container">
            <h1 style="color:#FFC0CB; text-align:center;">Create Your Account</h1>
            <p style="text-align:center; color:#555; margin-bottom:30px;">Join PetHome.</p>
            <hr>

            <div id="error-msg" style="display:none; background:#ffeaea; color:#e74c3c; padding:12px; border-radius:8px; margin-bottom:16px; text-align:center; font-weight:bold;"></div>

            <form id="register-form" autocomplete="off">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="first_name" placeholder="Enter your first name" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="last_name" placeholder="Enter your last name" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="phone" placeholder="01xxxxxxxxx" maxlength="11"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="text" id="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>I am a...</label>
                    <select id="role" style="width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:1rem;background:#fafafa;box-sizing:border-box;">
                        <option value="adopter">🐾 Adopter - Looking to adopt a pet</option>
                        <option value="shelter">🏠 Shelter / Rescuer - I manage pets</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Create a strong password" minlength="8" required>
                         <i class="fa-regular fa-eye-slash" 
                         onclick="togglePassword('password', this)"
                         style="position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1.2rem; user-select:none; color: #666;">
                         </i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm_password" placeholder="Re-enter your password" minlength="8" required>
                        <i class="fa-regular fa-eye-slash" 
                        onclick="togglePassword('confirm_password', this)"
                        style="position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1.2rem; user-select:none; color: #666;">
                        </i>
                    </div>
                </div>
                <button type="submit" class="apply-btn" id="submitBtn">Create Account</button>
            </form>

            <p style="text-align:center; margin-top:30px; color:#666;">
                Already have an account? <a href="login.html" style="color:#1A2B47;font-weight:bold;">Log in here</a>
            </p>
        </div>
    </main>

    <footer><p>&copy; 2025 PetHome. All rights reserved.</p></footer>

    <script>
    function togglePassword(id, icon) {
      const input = document.getElementById(id);
    
       if (input.type === 'password') {
         input.type = 'text';
         // تغيير شكل الأيقونة للعين المفتوحة
         icon.className = 'fa-regular fa-eye'; 
        } else {
         input.type = 'password';
        // تغيير شكل الأيقونة للعين المقفولة (عليها خط)
         icon.className = 'fa-regular fa-eye-slash'; 
    }
}

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.getElementById('submitBtn');

            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match.';
                errorMsg.style.display = 'block';
                return;
            }

            submitBtn.textContent = 'Creating account...';
            submitBtn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        first_name: document.getElementById('first_name').value,
                        last_name: document.getElementById('last_name').value,
                        phone: document.getElementById('phone').value,
                        email: document.getElementById('email').value,
                        role: document.getElementById('role').value,
                        password
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Registration failed');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                alert(`🐾 Welcome to PetHome, ${data.user.first_name}!`);
                window.location.href = 'index.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                submitBtn.textContent = 'Create Account';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
